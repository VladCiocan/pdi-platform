server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: infrastructure-service

  datasource:
    url: jdbc:postgresql://${PDI_DB_HOST:localhost}:${PDI_DB_PORT:5432}/${PDI_DB_NAME:pdi}
    username: ${PDI_DB_USER:pdi_user}
    password: ${PDI_DB_PASSWORD:pdi_pass_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${PDI_JWT_SECRET:pd1-s3cr3t-k3y-f0r-t0k3n-g3n3r4t10n-2024-nuc3t}
  cors:
    allowed-origins: ${PDI_CORS_ORIGINS:http://localhost:4200,http://localhost:8080}

logging:
  level:
    root: INFO
    ro.pdi.infrastructure: DEBUG
  file:
    name: logs/infrastructure-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    ro.pdi.infrastructure: INFO