server:
  port: ${ERP_PORT:8087}

spring:
  application:
    name: erp-service
  datasource:
    url: jdbc:postgresql://${PDI_DB_HOST:localhost}:${PDI_DB_PORT:5432}/${PDI_DB_NAME:pdi}
    username: ${PDI_DB_USER:pdi_user}
    password: ${PDI_DB_PASSWORD:pdi_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    ro.pdi.erp: INFO
    org.springframework.web: INFO
    org.hibernate: WARN