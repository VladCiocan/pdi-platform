server:
  port: 8084
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: agriculture-service

  datasource:
    url: jdbc:postgresql://${PDI_DB_HOST:localhost}:${PDI_DB_PORT:5432}/${PDI_DB_NAME:pdi}
    username: ${PDI_DB_USER:pdi_user}
    password: ${PDI_DB_PASSWORD:pdi_pass_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${PDI_JWT_SECRET:pd1-s3cr3t-k3y-f0r-t0k3n-g3n3r4t10n-2024-nuc3t}

  cors:
    allowed-origins: ${PDI_CORS_ORIGINS:http://localhost:4200,http://localhost:8080}

logging:
  level:
    root: INFO
    ro.pdi.agriculture: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/agriculture-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  level:
    ro.pdi.agriculture: TRACE

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    ro.pdi.agriculture: INFO

app:
  jwt:
    secret: ${PDI_JWT_SECRET}
  cors:
    allowed-origins: ${PDI_CORS_ORIGINS}