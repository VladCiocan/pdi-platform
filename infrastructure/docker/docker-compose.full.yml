version: '3.9'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pdi-postgres
    environment:
      POSTGRES_DB: ${PDI_DB_NAME:-pdi}
      POSTGRES_USER: ${PDI_DB_USER:-pdi_user}
      POSTGRES_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      POSTGIS_GDAL_DRIVER_PATH: /usr/share/gdal/3.4.0/gdal_MJPEG.so
      POSTGIS_GDAL_DATA: /usr/share/postgis/3.4.0/gdal
      POSTGIS_PROJ_DATA: /usr/share/postgis/3.4.0/proj
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDI_DB_USER:-pdi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pdi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend - Auth Service
  auth-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-auth-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/auth-service/target/auth-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-pdi_jwt_secret_key_2024_very_long_and_secure}
      JWT_EXPIRATION: 3600000
      JWT_REFRESH_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - Tax Service
  tax-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-tax-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/tax-service/target/tax-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - Urbanism Service
  urbanism-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-urbanism-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/urbanism-service/target/urbanism-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - Agriculture Service
  agriculture-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-agriculture-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/agriculture-service/target/agriculture-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - Infrastructure Service
  infrastructure-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-infrastructure-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/infrastructure-service/target/infrastructure-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - ERP Service
  erp-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-erp-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/erp-service/target/erp-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - DMS Service
  dms-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-dms-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/dms-service/target/dms-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - GIS Service
  gis-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-gis-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/gis-service/target/gis-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # Backend - Project Service
  project-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: pdi-project-service
    command: java -jar /app/app.jar
    volumes:
      - ../../backend/project-service/target/project-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network

  # API Gateway (nginx)
  gateway:
    image: nginx:alpine
    container_name: pdi-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - tax-service
      - urbanism-service
      - agriculture-service
      - infrastructure-service
      - erp-service
      - dms-service
      - gis-service
      - project-service
    networks:
      - pdi-network

  # Frontend - Angular
  frontend:
    build:
      context: ../../frontend/web-app
      dockerfile: Dockerfile
    container_name: pdi-frontend
    environment:
      NG_ENV_API_URL: /api
      NG_ENV_AUTH_URL: /api/auth
    ports:
      - "4200:80"
    depends_on:
      - gateway
    networks:
      - pdi-network

networks:
  pdi-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local