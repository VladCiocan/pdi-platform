version: '3.9'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pdi-postgres
    environment:
      POSTGRES_DB: ${PDI_DB_NAME:-pdi}
      POSTGRES_USER: ${PDI_DB_USER:-pdi_user}
      POSTGRES_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDI_DB_USER:-pdi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pdi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend - Auth Service (built from source)
  auth-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile.services
      target: auth
    container_name: pdi-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      PDI_JWT_SECRET: ${PDI_JWT_SECRET:-pd1-s3cr3t-k3y-f0r-t0k3n-g3n3r4t10n-2024-nuc3t}
      PDI_DB_HOST: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdi-network
    restart: unless-stopped

  # Backend - Tax Service (built from source)
  tax-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile.services
      target: tax
    container_name: pdi-tax-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      PDI_JWT_SECRET: ${PDI_JWT_SECRET:-pd1-s3cr3t-k3y-f0r-t0k3n-g3n3r4t10n-2024-nuc3t}
      PDI_DB_HOST: postgres
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network
    restart: unless-stopped

  # Backend - Urbanism Service (built from source)
  urbanism-service:
    build:
      context: ../../backend
      dockerfile: Dockerfile.services
      target: urbanism
    container_name: pdi-urbanism-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PDI_DB_NAME:-pdi}
      SPRING_DATASOURCE_USERNAME: ${PDI_DB_USER:-pdi_user}
      SPRING_DATASOURCE_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
      PDI_JWT_SECRET: ${PDI_JWT_SECRET:-pd1-s3cr3t-k3y-f0r-t0k3n-g3n3r4t10n-2024-nuc3t}
      PDI_DB_HOST: postgres
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdi-network
    restart: unless-stopped

  # Backend - Agriculture Service (built from source)
  agriculture-service:
    build:
