  # API Gateway (nginx)
  gateway:
    image: nginx:alpine
    container_name: pdi-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - tax-service
      - urbanism-service
      - agriculture-service
      - infrastructure-service
      - erp-service
      - dms-service
      - gis-service
      - project-service
      - frontend
