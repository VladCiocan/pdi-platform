upstream auth-service {
    server auth-service:8081;
}

upstream tax-service {
    server tax-service:8082;
}

upstream urbanism-service {
    server urbanism-service:8083;
}

upstream agriculture-service {
    server agriculture-service:8084;
}

upstream infrastructure-service {
    server infrastructure-service:8085;
}

upstream erp-service {
    server erp-service:8086;
}

upstream dms-service {
    server dms-service:8087;
}

upstream gis-service {
    server gis-service:8088;
}

upstream project-service {
    server project-service:8089;
}

server {
    listen 80;
    server_name localhost;

    # Auth Service - /api/auth/* -> /api/v1/auth/*
    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /api/v1/auth/$1 break;
        proxy_pass http://auth-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Tax Service - /api/taxes/* -> /api/v1/taxes/*
    location /api/taxes/ {
        rewrite ^/api/taxes/(.*)$ /api/v1/taxes/$1 break;
        proxy_pass http://tax-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Urbanism Service
    location /api/urbanism/ {
        rewrite ^/api/urbanism/(.*)$ /api/v1/urbanism/$1 break;
        proxy_pass http://urbanism-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Agriculture Service
    location /api/agriculture/ {
        rewrite ^/api/agriculture/(.*)$ /api/v1/agriculture/$1 break;
        proxy_pass http://agriculture-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Infrastructure Service
    location /api/infrastructure/ {
        rewrite ^/api/infrastructure/(.*)$ /api/v1/infrastructure/$1 break;
        proxy_pass http://infrastructure-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ERP Service
    location /api/erp/ {
        rewrite ^/api/erp/(.*)$ /api/v1/erp/$1 break;
        proxy_pass http://erp-service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
