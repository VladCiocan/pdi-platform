version: '3.9'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pdi-postgres
    environment:
      POSTGRES_DB: ${PDI_DB_NAME:-pdi}
      POSTGRES_USER: ${PDI_DB_USER:-pdi_user}
      POSTGRES_PASSWORD: ${PDI_DB_PASSWORD:-pdi_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDI_DB_USER:-pdi_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pdi-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Frontend - Angular (if built locally)
  frontend:
    build:
      context: ../../frontend/web-app
      dockerfile: Dockerfile
    container_name: pdi-frontend
    ports:
      - "4200:80"
    networks:
      - pdi-network
    profiles:
      - full

networks:
  pdi-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local