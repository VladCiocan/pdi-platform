services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pdi-postgres
    environment:
      POSTGRES_DB: pdi
      POSTGRES_USER: pdi_user
      POSTGRES_PASSWORD: pdi_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdi_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pdi-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # API Gateway (nginx)
  gateway:
    image: nginx:alpine
    container_name: pdi-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pdi-network

networks:
  pdi-network:
    driver: bridge