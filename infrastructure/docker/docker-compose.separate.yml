services:
  # Database
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pdi-postgres
    environment:
      POSTGRES_DB: pdi
      POSTGRES_USER: pdi_user
      POSTGRES_PASSWORD: pdi_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdi_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pdi-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - pdi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend Container
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: pdi-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pdi
      SPRING_DATASOURCE_USERNAME: pdi_user
      SPRING_DATASOURCE_PASSWORD: pdi_pass_2024
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: pdi_jwt_secret_key_2024_very_long_and_secure
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pdi-network

  # Frontend Container
  frontend:
    build:
      context: ../../frontend/web-app
      dockerfile: Dockerfile
    container_name: pdi-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - pdi-network

  # Nginx Gateway
  gateway:
    image: nginx:alpine
    container_name: pdi-gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pdi-network

networks:
  pdi-network:
    driver: bridge